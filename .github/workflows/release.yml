name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type de version"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Vérifier la branche
        shell: bash
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "Une release doit être lancée depuis ${DEFAULT_BRANCH}"
            echo "Branche actuelle : ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Rendre Gradle exécutable
        run: chmod +x gradlew

      - name: Calculer la nouvelle version
        id: version
        shell: bash
        run: |
          CURRENT_VERSION="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')"

          echo "Version actuelle : ${CURRENT_VERSION}"

          if ! [[ "${CURRENT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide dans gradle.properties : ${CURRENT_VERSION}"
            echo "Format attendu : X.Y.Z"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"

          case "${{ inputs.release_type }}" in
            patch)
              PATCH=$((PATCH + 1))
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            *)
              echo "Type de release invalide"
              exit 1
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "Nouvelle version : ${NEW_VERSION}"

          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour gradle.properties
        shell: bash
        run: |
          sed -i \
            's/^mod_version=.*/mod_version=${{ steps.version.outputs.version }}/' \
            gradle.properties

          echo "Nouvelle valeur :"
          grep '^mod_version=' gradle.properties

      - name: Vérifier que le tag n'existe pas
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Le tag $TAG existe déjà."
            exit 1
          fi

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Afficher les fichiers générés
        run: ls -lah build/libs

      - name: Commit de la nouvelle version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradle.properties

          git commit \
            -m "chore(release): v${{ steps.version.outputs.version }}"

      - name: Créer le tag
        shell: bash
        run: |
          git tag \
            -a "${{ steps.version.outputs.tag }}" \
            -m "Root Companion ${{ steps.version.outputs.tag }}"

      - name: Push commit et tag
        shell: bash
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Trouver le JAR
        id: jar
        shell: bash
        run: |
          JAR="$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "Aucun JAR trouvé dans build/libs"
            exit 1
          fi

          echo "JAR trouvé : $JAR"

          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create \
            "${{ steps.version.outputs.tag }}" \
            "${{ steps.jar.outputs.path }}" \
            --verify-tag \
            --title "Root Companion ${{ steps.version.outputs.tag }}" \
            --generate-notes